name: Build ArtMoon Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        if: env.ARTMOON_KEYSTORE_B64 != ''
        env:
          ARTMOON_KEYSTORE_B64: ${{ secrets.ARTMOON_KEYSTORE_B64 }}
        run: |
          echo "$ARTMOON_KEYSTORE_B64" | base64 -d > /tmp/artmoon.keystore
          echo "ARTMOON_KEYSTORE=/tmp/artmoon.keystore" >> "$GITHUB_ENV"

      - name: Build nonRoot release APK
        working-directory: android
        env:
          ARTMOON_KEYSTORE_PASSWORD: ${{ secrets.ARTMOON_KEYSTORE_PASSWORD }}
          ARTMOON_KEY_ALIAS: ${{ secrets.ARTMOON_KEY_ALIAS }}
          ARTMOON_KEY_PASSWORD: ${{ secrets.ARTMOON_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtMoon-Android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/nonRoot/release/*.apk

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/nonRoot/release/*.apk
