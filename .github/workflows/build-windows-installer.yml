---
name: Build Windows installer
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'libs/**'
      - 'service/**'
      - 'ArtMoon.iss'
      - 'moonlight-qt.pro'
      - '.github/workflows/build-windows-installer.yml'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3 (msvc2022_64)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          set-env: false
          add-tools-to-path: false

      - name: Build + deploy (build-arch.bat + windeployqt + libs)
        shell: pwsh
        env:
          ARTMOON_QT_BIN: '${{ runner.workspace }}\Qt\6.8.3\msvc2022_64\bin'
        run: ./scripts/ci-deploy-windows.ps1

      - name: Fetch the bundled USB/IP engine (usbipd-win)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ArtMoon cannot share a device without usbipd-win: it reads `usbipd list` and runs
          # `usbipd bind` through the input service. It is carried rather than assumed, so a PC
          # that has never seen USB/IP still gets a working USB tab instead of a dead end.
          # Version and hash are pinned because this file is handed to msiexec with
          # administrator rights on a user's machine — a silently substituted download would
          # be the whole attack, so a mismatch is fatal rather than a warning.
          $version = '5.3.0'
          $sha256  = '1C984914AEC944DE19B64EFF232421439629699F8138E3DDC29301175BC6D938'
          $name    = "usbipd-win_${version}_x64.msi"
          $dest    = 'build/vendor'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $out = Join-Path $dest $name
          Invoke-WebRequest -Uri "https://github.com/dorssel/usbipd-win/releases/download/v$version/$name" -OutFile $out
          $got = (Get-FileHash $out -Algorithm SHA256).Hash
          if ($got -ne $sha256) {
            throw "usbipd-win $name hash mismatch: got $got, expected $sha256"
          }
          Write-Host "usbipd-win $version verified: $((Get-Item $out).Length) bytes, sha256 $got"

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup7.exe"
          Start-Process -FilePath "$env:TEMP\innosetup7.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 7\ISCC.exe", "C:\Program Files\Inno Setup 7\ISCC.exe", "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found" }
          Write-Host "Using ISCC: $($iscc.FullName)"
          # ArtMoon.iss hard-errors if the USB/IP payload is missing, so a compile that
          # succeeds is a compile that carries it - no separate check needed here.
          & $iscc.FullName ArtMoon.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          $setupExe = Get-ChildItem "build/installer/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setupExe) { throw "installer was not produced in build/installer" }
          Write-Host "ArtMoon installer ready: $($setupExe.FullName)"

      - name: Verify the installer carries its version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The updater only offers an update when an asset matches
          # ^ArtMoon_(\d+(\.\d+){1,3})_Installer\.exe$ AND the version in the
          # name equals the release tag (app/backend/appupdate.cpp). Anything
          # else is invisible to every Windows user, with no error to go on, so
          # catch it at build time rather than at release time.
          $exe = Get-ChildItem "build/installer/*.exe" | Select-Object -First 1
          if ($exe.Name -notmatch '^ArtMoon_\d+(\.\d+){1,3}_Installer\.exe$') {
            throw "Installer is '$($exe.Name)'; the updater requires ArtMoon_<version>_Installer.exe"
          }
          Write-Host "Installer name is good: $($exe.Name)"
          $tag = "${{ inputs.release_tag }}"
          if ($tag) {
            $want = "ArtMoon_$($tag.TrimStart('v'))_Installer.exe"
            if ($exe.Name -ne $want) {
              throw "Installer is '$($exe.Name)' but tag $tag needs '$want' - does ArtMoon.iss AppVersion still need bumping?"
            }
            Write-Host "Name matches the tag: $want"
          }

      - name: Upload symbols for crash triage
        uses: actions/upload-artifact@v4
        with:
          # A heap-corruption crash leaves a dump full of addresses. Without the
          # matching PDB those addresses are noise, and force_debug_info already
          # produces one - it just used to die with the runner. Kept for the same
          # 90 days as everything else so a crash reported weeks later still names
          # the function that caused it instead of an offset.
          name: ArtMoon-symbols${{ inputs.release_tag && format('-{0}', inputs.release_tag) || '' }}
          path: |
            build/build-x64-release/app/release/ArtMoon.pdb
            build/build-x64-release/app/release/ArtMoon.exe
          if-no-files-found: warn
          retention-days: 90

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtMoon-installer${{ inputs.release_tag && format('-{0}', inputs.release_tag) || '' }}
          path: build/installer/*.exe
          if-no-files-found: error
